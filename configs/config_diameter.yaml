# Separate lesion center + diameter training config.
seed: 1337

data:
  train_csv: data_multiscale/train.csv
  val_csv: data_multiscale/val.csv
  # CSV columns: image_path, points_json, prior_path(optional)
  # points_json example: [[1234,567,42.0],[2222,3333,84.0]]
  tile_size: 768
  train_samples_per_epoch: 50
  positive_fraction: 0.40
  high_prior_negative_fraction: 0.30
  low_prior_fraction: 0.10
  validation_sampling:
    enabled: true
    samples_per_image: 4
    seed: 1337
    positive_fraction: 0.40
  prior_threshold: 0.35
  sigma_px: 6
  diameter_mask_threshold: 0.25
  channels: 3
  num_workers: 6

model:
  hf_model_name: facebook/dinov3-vits16-pretrain-lvd1689m
  freeze_backbone: true
  use_prior: true
  head_channels: 256

train:
  output_dir: runs/lesion_dinov3_vits_diameter
  epochs: 10
  batch_size: 8
  head_lr: 0.0003
  backbone_lr: 0.000003
  weight_decay: 0.0001
  amp: true
  loss: focal_bce
  pos_weight: 20.0
  focal_gamma: 2.0
  lambda_size: 0.25
  save_every: 1

infer:
  checkpoint: runs/lesion_dinov3_vits_diameter/best.pt
  tile_size: 768
  stride: 512
  batch_size: 8
  threshold: 0.30
  nms_radius_px: 30
  max_candidates: 5000
  prior_blend_alpha: 0.0
