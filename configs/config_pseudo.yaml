# Lesion DINOv3 point-supervised heatmap detector config
seed: 1337

data:
  manual_csv: data_singlescale/train.csv
  psuedo_csv: data_singlescale/psuedo.csv
  val_csv: data_multiscale/val.csv
  # CSV columns: image_path, points_json, prior_path(optional)
  # points_json example: [[1234,567],[2222,3333]] in full-image pixel coordinates
  tile_size: 768
  train_samples_per_epoch: 10000 #20000
  positive_fraction: 0.40
  high_prior_negative_fraction: 0.30
  random_negative_fraction: 0.20
  low_prior_fraction: 0.10
  validation_sampling:
    enabled: true
    samples_per_image: 80
    seed: 1337
    positive_fraction: 0.40
    high_prior_fraction: 0.30
    low_prior_fraction: 0.10
  prior_threshold: 0.35
  diameter_aware_heatmap:
    enabled: false
    min_sigma: 3.0
    max_sigma: 12.0
  sigma_px: 6
  channels: 3
  num_workers: 6

model:
  hf_model_name: facebook/dinov3-vits16-pretrain-lvd1689m
  freeze_backbone: true
  use_prior: true
  head_channels: 256 

train:
  output_dir: runs/lesion_dinov3_vits_psuedo_finetune
  epochs: 10
  unfreeze_epoch: None
  batch_size: 8 #8
  head_lr: 0.0003
  backbone_lr: 0.000003
  weight_decay: 0.0001
  amp: true
  loss: focal_bce  # focal_bce or weighted_bce
  loss_logits_small: false # compute loss on dino output size vs upsmapling to input size
  pos_weight: 20.0
  focal_gamma: 2.0
  save_every: 1

infer:
  checkpoint: runs/lesion_dinov3_vits_original/best.pt
  tile_size: 768
  stride: 512
  batch_size: 8
  threshold: 0.30
  nms_radius_px: 30 #Question
  max_candidates: 5000
  prior_blend_alpha: 0.0  # 0 means detector only; e.g. 0.2 = 0.8 detector + 0.2 prior
